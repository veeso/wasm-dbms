[workspace]
members = [
  "crates/wasi-dbms/wasi-dbms-memory",
  "crates/wasm-dbms/example/guest",
  "crates/wasm-dbms/example/host",
  "crates/wasm-dbms/wasm-dbms",
  "crates/wasm-dbms/wasm-dbms-api",
  "crates/wasm-dbms/wasm-dbms-bench",
  "crates/wasm-dbms/wasm-dbms-macros",
  "crates/wasm-dbms/wasm-dbms-memory",
  "crates/wasm-dbms/wasm-dbms-sql",
]
resolver = "3"

[workspace.package]
version = "0.10.1"
authors = ["Christian Visintin <christian.visintin@veeso.dev>"]
categories = ["database", "network-programming", "wasm"]
edition = "2024"
keywords = ["database", "dbms", "wasm", "wasm-database"]
license = "MIT"
repository = "https://github.com/veeso/wasm-dbms"
rust-version = "1.91.1"

[workspace.dependencies]
candid = { version = "0.10", features = ["value"] }
criterion = "0.8"
duckdb = { version = "1", features = ["bundled"] }
getrandom = { version = "0.4", default-features = false }
lazy-regex = "3"
percent-encoding = "2"
proc-macro2 = "1"
quote = "1"
rand = "0.10"
rusqlite = { version = "0.40", features = ["bundled"] }
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = "3"
thiserror = "2"
url = "2"
uuid = { version = "1", default-features = false, features = ["v7", "rng-getrandom"] }
wasm-dbms = { version = "0.10", path = "crates/wasm-dbms/wasm-dbms" }
wasm-dbms-api = { version = "0.10", path = "crates/wasm-dbms/wasm-dbms-api" }
wasm-dbms-macros = { version = "0.10", path = "crates/wasm-dbms/wasm-dbms-macros" }
wasm-dbms-memory = { version = "0.10", path = "crates/wasm-dbms/wasm-dbms-memory" }
wasmtime = { version = "49", features = ["component-model"] }
wasmtime-wasi = "49"
wit-bindgen = { version = "0.62", default-features = false, features = ["macros", "realloc"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
