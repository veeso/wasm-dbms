[package]
name = "ic-dbms-client"
version = { workspace = true }
authors = { workspace = true }
categories = { workspace = true }
documentation = "https://docs.rs/ic-dbms-client/"
edition = { workspace = true }
include = [
  "examples/**/*",
  "src/**/*",
  "../../../LICENSE",
  "README.md",
  "../../../CHANGELOG.md",
]
keywords = { workspace = true }
license = { workspace = true }
readme = "README.md"
repository = { workspace = true }
rust-version = { workspace = true }
description = "ic-dbms-canister client library for interacting with the ic-dbms-canister."

[dependencies]
candid = { workspace = true }
ic-agent = { workspace = true, optional = true }
ic-cdk = { workspace = true }
ic-dbms-api = { workspace = true }
pocket-ic = { workspace = true, optional = true }
thiserror = { workspace = true }

[dev-dependencies]
serde = { workspace = true }
tokio = { workspace = true }
wasm-dbms-api = { workspace = true }

[features]
default = []
ic-agent = ["dep:ic-agent"]
pocket-ic = ["dep:pocket-ic"]

[[example]]
name = "client"
path = "examples/client.rs"

[package.metadata.docs.rs]
features = ["ic-agent", "pocket-ic"]
rustdoc-args = ["--cfg", "docsrs"]
