[package]
name = "wasm-dbms-bench"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true

[features]
access-stats = ["wasm-dbms/access-stats"]

[dependencies]
criterion = { workspace = true }
duckdb = { workspace = true }
rand = { workspace = true }
rusqlite = { workspace = true }
wasm-dbms = { workspace = true }
wasm-dbms-api = { workspace = true }
wasm-dbms-macros = { workspace = true }
wasm-dbms-memory = { workspace = true }

[[bench]]
name = "compare"
harness = false

[[bench]]
name = "index_planning"
harness = false

[[bin]]
name = "index_planning_stats"
required-features = ["access-stats"]
